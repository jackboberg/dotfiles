# `sheldon` configuration file
# ----------------------------
#
# You can modify this file directly or you can use one of the following
# `sheldon` commands which are provided to assist in editing the config file:
#
# - `sheldon add` to add a new plugin to the config file
# - `sheldon edit` to open up the config file in the default editor
# - `sheldon remove` to remove a plugin from the config file
#
# See the documentation for more https://github.com/rossmacarthur/sheldon#readme

shell = "zsh"

[plugins]

# For example:
#
# [plugins.base16]
# github = "chriskempson/base16-shell"

[plugins.zsh-async]
github = "mafredri/zsh-async"

[plugins.promptinit]
inline = "autoload -U promptinit; promptinit"

[plugins.syntax-highlighting]
github="zdharma/fast-syntax-highlighting"

[plugins.history-substring-search]
github = "zsh-users/zsh-history-substring-search"

[plugins.history-fzy]
gist = "shogogg/86f13a0aff12b9a31efb083946a500cb"

# Sourced for its `dc*` aliases only. Deliberately no "fpath": the plugin's
# vendored _docker-compose is stale, and completion now comes from the docker
# CLI itself, registered below.
[plugins.docker-compose]
github = "robbyrussell/oh-my-zsh"
dir = "plugins/{{ name }}"
apply = ["source"]

[plugins.mise]
inline = 'eval "$(mise activate zsh)"'

# cargo/rustc completions from the rustup toolchain mise installs. mise names
# the toolchain by version (1.98.0-aarch64-apple-darwin), so glob it; the (N)
# qualifier keeps this quiet before rust is installed.
[plugins.rust]
inline = 'fpath+=(${RUSTUP_HOME:-$HOME/.local/share/rustup}/toolchains/*/share/zsh/site-functions(N))'

# Completion system. A single compinit, deliberately placed here: after every
# plugin above that appends to $fpath, and before every plugin below that
# calls `compdef`, since compinit is what defines it.
[plugins.compinit]
inline = '''
autoload -Uz compinit
zdump=${ZDOTDIR:-$HOME}/.zcompdump
if [[ ! -e $zdump || -n $zdump(#qNmh+24) ]]; then
  compinit -d $zdump
else
  compinit -C -d $zdump
fi
unset zdump
'''

# --- Everything below calls `compdef`, so it must stay after compinit. ---

[plugins.enhancd]
github = "b4b4r07/enhancd"

# Docker ships a dynamic completer that tracks the installed CLI and its
# plugins, unlike the stale static ones vendored in oh-my-zsh.
[plugins.docker-completions]
inline = '''
if command -v docker >/dev/null 2>&1; then
  _docker_lazy() {
    eval "$(command docker completion zsh)" || return
    compdef _docker docker docker-compose
    _docker "$@"
  }
  compdef _docker_lazy docker docker-compose
fi
'''

# Load local plugins last, so they can overwrite config
[plugins.dotfiles]
local = "~/.zsh"

